# =============================================================================
# CodeMind — Docker Compose (Phase 2)
#
# HOW TO RUN:
#   1. Copy ../.env.example to ../.env and fill in GROQ_API_KEY and JWT_SECRET
#   2. From this directory: docker compose up --build
#
# Services:
#   frontend        :5173  — React/Vite UI
#   auth            :5000  — Node.js monolith
#   websocket       :5004  — WebSocket real-time bridge
#   agent           :8000  — FastAPI (health + cleanup only in Phase 2)
#   query_worker_1/2/3    — Celery workers (query_jobs queue)
#   index_worker_1/2      — Celery workers (index_jobs queue)
#   qdrant          :6333  — Vector DB
#   mongo           :27017 — MongoDB
#   redis           :6379  — Celery broker + pub/sub
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_WS_URL=ws://localhost:5004
    depends_on:
      - auth
    networks:
      - codemind

  # ---------------------------------------------------------------------------
  # Auth Service — Node.js monolith :5000
  # Phase 2: no longer depends on agent directly
  # Jobs go through Redis queue instead
  # ---------------------------------------------------------------------------
  auth:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/codemind
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:5173
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongo
      - redis
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WebSocket Service — Node.js :5004
  # Subscribes to Redis pub/sub, pushes events to browser
  # ---------------------------------------------------------------------------
  websocket:
    build:
      context: ../services/websocket
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - WS_PORT=5004
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI Agent Service — FastAPI :8000
  # Phase 2: health check + cleanup only
  # Heavy work moved to Celery workers
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Query Workers — Celery (HIGH priority)
  # 3 separate named services = 3 real instances
  # deploy: replicas does NOT work in docker compose — use named services
  # ---------------------------------------------------------------------------
  query_worker_1:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q query_jobs --concurrency=1 --loglevel=info -n query_worker_1@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  query_worker_2:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q query_jobs --concurrency=1 --loglevel=info -n query_worker_2@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  query_worker_3:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q query_jobs --concurrency=1 --loglevel=info -n query_worker_3@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Index Workers — Celery (LOW priority)
  # 2 separate named services = 2 real instances
  # ---------------------------------------------------------------------------
  index_worker_1:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q index_jobs --concurrency=1 --loglevel=info -n index_worker_1@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  index_worker_2:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q index_jobs --concurrency=1 --loglevel=info -n index_worker_2@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - codemind
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + pub/sub + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codemind
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# =============================================================================
# Volumes
# =============================================================================
volumes:
  qdrant_data:
  mongo_data:
  agent_tmp:
  redis_data:

# =============================================================================
# Network
# =============================================================================
networks:
  codemind:
    driver: bridge