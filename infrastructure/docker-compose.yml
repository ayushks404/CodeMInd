# =============================================================================
# CodeMind — Docker Compose (Phase 2)

services:

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite :5173
  # Vite proxy routes /api/auth → :5001, /api/project → :5002, /api/query → :5003
  # so the browser only ever talks to one origin and CORS is never an issue.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Proxy targets — read by vite.config.js at dev-server startup
      - VITE_AUTH_URL=http://auth:5001
      - VITE_PROJECT_URL=http://project:5002
      - VITE_QUERY_URL=http://query:5003
      - VITE_WS_URL=ws://localhost:5004
    depends_on:
      - auth
      - project
      - query
    networks:
      - codemind

  # ---------------------------------------------------------------------------
  # Auth Service — Node.js :5001
  # ---------------------------------------------------------------------------
  auth:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/codemind
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:5173
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongo
      - redis
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Project Service — Node.js :5002
  # ---------------------------------------------------------------------------
  project:
    build:
      context: ../services/project
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/codemind
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth:5001
      - AI_SERVICE_URL=http://agent:8000
      # FIX: INTERNAL_SECRET was present but must also be kept here —
      # project service guards PATCH /:id/indexed with it
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo
      - redis
      - auth
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Query Service — Node.js :5003
  # FIX: was missing INTERNAL_SECRET — not needed by query service itself,
  # but added AUTH_SERVICE_URL which was already there. No change needed.
  # ---------------------------------------------------------------------------
  query:
    build:
      context: ../services/query
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/codemind
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth:5001
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo
      - redis
      - auth
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WebSocket Service — Node.js :5004
  # ---------------------------------------------------------------------------
  websocket:
    build:
      context: ../services/websocket
      dockerfile: Dockerfile
    ports:
      - "5004:5004"
    environment:
      - WS_PORT=5004
      - REDIS_URL=redis://redis:6379/0
      # FIX: the default in websocket/src/server.js was "http://auth-service:5001"
      # (wrong hostname). Explicitly set here to make the correct name visible.
      - AUTH_SERVICE_URL=http://auth:5001
    depends_on:
      - redis
      - auth
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI Agent Service — FastAPI :8000
  # FIX: Added PROJECT_SERVICE_URL and INTERNAL_SECRET — the FastAPI app itself
  # doesn't need them, but the index_worker Celery tasks run from the same image
  # and DO need these to call PATCH /api/project/:id/indexed after indexing.
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_SERVICE_URL=http://project:5002
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Query Workers — Celery
  # ---------------------------------------------------------------------------
  query_worker_1:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q query_jobs --concurrency=1 --loglevel=info -n query_worker_1@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  query_worker_2:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q query_jobs --concurrency=1 --loglevel=info -n query_worker_2@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  query_worker_3:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q query_jobs --concurrency=1 --loglevel=info -n query_worker_3@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - qdrant
      - redis
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Index Workers — Celery
  # FIX: PROJECT_SERVICE_URL and INTERNAL_SECRET were already here — good.
  # These are required so the worker can call PATCH /api/project/:id/indexed.
  # ---------------------------------------------------------------------------
  index_worker_1:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q index_jobs --concurrency=1 --loglevel=info -n index_worker_1@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_SERVICE_URL=http://project:5002
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - qdrant
      - redis
      - project
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  index_worker_2:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    command: celery -A celery_app worker -Q index_jobs --concurrency=1 --loglevel=info -n index_worker_2@%h
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - PROJECT_SERVICE_URL=http://project:5002
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - qdrant
      - redis
      - project
    volumes:
      - agent_tmp:/app/tmp
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - codemind
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MongoDB
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - codemind
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Celery broker + pub/sub + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codemind
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# =============================================================================
# Volumes
# =============================================================================
volumes:
  qdrant_data:
  mongo_data:
  agent_tmp:
  redis_data:

# =============================================================================
# Network
# =============================================================================
networks:
  codemind:
    driver: bridge
